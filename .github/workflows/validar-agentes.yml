name: Validar agentes Harvest

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/unit/deskcomm-harvest-guard.test.ts"
      - "tests/unit/crm-zernio-oauth.test.ts"
      - "sql/049_zernio_social_oauth.sql"
      - "sql/033_agentes_workspace.sql"
      - "sql/034_agentes_figueira_habilitacao.sql"
      - "tests/unit/agentes.test.ts"
      - "tests/unit/conexaoIAWorkspace.test.ts"
      - "tests/unit/crm-tarefas.test.ts"
      - "tests/unit/crm-contatos.test.ts"
      - "tests/unit/crm-timeline.test.ts"
      - "tests/unit/crm-atendimentos.test.ts"
      - "tests/unit/crm-atendimentos-canais.test.ts"
      - "tests/unit/crm-ux-integridade.test.ts"
      - "tests/unit/crm-fontes-webchat.test.ts"
      - "tests/unit/crm-meta-oauth-webhook.test.ts"
      - "tests/unit/crm-integracoes-kommo.test.ts"
      - "tests/unit/crm-meta-subscription.test.ts"
      - "tests/unit/crm-meta-swarm-secrets.test.ts"
      - "tests/unit/crm-meta-derived-keys.test.ts"
      - "sql/047_meta_assinatura_pagina.sql"
      - "sql/046_meta_oauth_mensagens.sql"
      - "sql/045_fontes_multicanal_e_webchat.sql"
      - "sql/043_atendimentos_independentes_por_canal.sql"
      - "tests/unit/crm-etiquetas.test.ts"
      - "tests/unit/canais-unificados.test.ts"
      - "tests/unit/canal-funil.test.ts"
      - "tests/unit/inbound-canal-funil.test.ts"
      - "tests/unit/crm-inbound-autocriacao.test.ts"
      - "sql/044_negocio_inbound_optin.sql"
      - "sql/042_inbound_canal_funil.sql"
      - "sql/041_funis_canal_whatsapp.sql"
      - "tests/unit/crm-cadastros.test.ts"
      - "tests/unit/crm-catalogo-busca.test.ts"
      - "tests/unit/crm-catalogo-rota.test.ts"
      - "tests/unit/crm-social-oportunidade.test.ts"
      - "tests/unit/crm-agenda.test.ts"
      - "tests/unit/crm-agenda-rota.test.ts"
      - "sql/051_contatos_atendimentos_sociais.sql"
      - "tests/unit/crm-chatwoot-handoff.test.ts"
      - "sql/039_crm_chatwoot_encaminhamentos.sql"
      - "sql/038_crm_cadastros_campos.sql"
      - "sql/037_crm_etiquetas_sla_auditoria.sql"
      - "sql/036_crm_atendimentos.sql"
      - "sql/035_crm_avancado_figueira.sql"
      - ".github/workflows/validar-agentes.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verificar o isolamento e os agentes
        run: node --experimental-strip-types tests/unit/agentes.test.ts
      - name: Testar conexao IA compartilhada com Configuracoes
        run: node --experimental-strip-types tests/unit/conexaoIAWorkspace.test.ts
      - name: Testar CRM avancado e isolamento por workspace
        run: node --experimental-strip-types tests/unit/crm-tarefas.test.ts
      - name: Testar CRM contatos sem mesclar identidades incertas
        run: node --experimental-strip-types tests/unit/crm-contatos.test.ts
      - name: Testar timeline unificada do CRM
        run: node --experimental-strip-types tests/unit/crm-timeline.test.ts
      - name: Testar isolamento da Inbox CRM por atendente
        run: node --experimental-strip-types tests/unit/crm-atendimentos.test.ts
      - name: Testar etiquetas coloridas, prioridades e SLA
        run: node --experimental-strip-types tests/unit/crm-etiquetas.test.ts
      - name: Testar empresas produtos e campos personalizados
        run: node --experimental-strip-types tests/unit/crm-cadastros.test.ts
      - name: Testar busca e paginação do catálogo completo
        run: node --experimental-strip-types tests/unit/crm-catalogo-busca.test.ts
      - name: Testar rota do catálogo com isolamento e autorização
        run: node --experimental-strip-types tests/unit/crm-catalogo-rota.test.ts
      - name: Testar atendimento Instagram na oportunidade sem telefone
        run: node --experimental-strip-types tests/unit/crm-social-oportunidade.test.ts
      - name: Testar agenda, fuso e integração de tarefas
        run: |
          node --experimental-strip-types tests/unit/crm-agenda.test.ts
          node --experimental-strip-types tests/unit/crm-agenda-rota.test.ts
      - name: Testar isolamento do encaminhamento Chatwoot
        run: node --experimental-strip-types tests/unit/crm-chatwoot-handoff.test.ts
      - name: Testar contrato dos canais de atendimento
        run: node --experimental-strip-types tests/unit/canais-unificados.test.ts
      - name: Testar vínculo seguro do canal de cada funil
        run: node --experimental-strip-types tests/unit/canal-funil.test.ts
      - name: Validar recepção por canal e roteamento não ambíguo
        run: node --experimental-strip-types tests/unit/inbound-canal-funil.test.ts
      - name: Testar atendimento e responsáveis isolados por canal
        run: node --experimental-strip-types tests/unit/crm-atendimentos-canais.test.ts
      - name: Testar criação de negócio opt-in com guarda de mensagem
        run: node --experimental-strip-types tests/unit/crm-inbound-autocriacao.test.ts
      - name: Verificar disposição das telas e segurança do CRM
        run: node --experimental-strip-types tests/unit/crm-ux-integridade.test.ts
      - name: Verificar fontes Meta e webchat na Inbox
        run: node --experimental-strip-types tests/unit/crm-fontes-webchat.test.ts
      - name: Verificar OAuth Meta, segredo e mensagens assinadas
        run: node --experimental-strip-types tests/unit/crm-meta-oauth-webhook.test.ts
      - name: Validar painel único de integrações e OAuth Meta
        run: node --experimental-strip-types tests/unit/crm-integracoes-kommo.test.ts
      - name: Validar inscrição real Messenger e fluxo OAuth no clique
        run: node --experimental-strip-types tests/unit/crm-meta-subscription.test.ts
      - name: Validar leitura segura de credenciais Meta via Docker Secrets
        run: node --experimental-strip-types tests/unit/crm-meta-swarm-secrets.test.ts
      - name: Validar derivação de segredos Meta e página de verificação
        run: node --experimental-strip-types tests/unit/crm-meta-derived-keys.test.ts
      - name: Verificar OAuth Zernio, webhook e isolamento
        run: node --experimental-strip-types tests/unit/crm-zernio-oauth.test.ts
      - name: Garantir preservação da prospecção na migração Deskcomm
        run: node --experimental-strip-types tests/unit/deskcomm-harvest-guard.test.ts
      - name: Instalar dependencias
        working-directory: app
        run: npm ci
      - name: Validar tipos
        working-directory: app
        run: npx tsc --noEmit
      - name: Build sem usar recursos da VPS
        working-directory: app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build
